[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fwf-carotid"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jax", "numpy", "scipy"]

[project.optional-dependencies]
pardiso = ["pypardiso"]

[project.scripts]
fem-abaqus = "fem.abaqus_interface.inp:main"
fem-vs-abaqus = "fem.abaqus_interface.vs_abaqus:main"

[tool.setuptools]
packages = ["fem", "fem.abaqus_interface", "materials", "verification"]
